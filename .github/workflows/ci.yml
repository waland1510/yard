name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-cache

      - name: Lint
        run: bun nx run-many -t lint -p frontend-pixi backend shared-utils

      - name: Type check
        run: bun nx run-many -t typecheck -p frontend-pixi backend

      - name: Test frontend
        run: bun nx test frontend-pixi

      - name: Build
        run: bun nx run-many -t build -p frontend-pixi backend
